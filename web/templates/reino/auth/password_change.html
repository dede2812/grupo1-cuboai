{% extends "reino/base.html" %}
{% block title %}Cambiar contraseña · Reino Commerce{% endblock %}
{% block content %}
<section class="section container" style="max-width:560px">
    <p class="eyebrow">Seguridad de tu cuenta</p>
    <h1>Cambiar contraseña</h1>
    <form class="step-card" method="post">
        {% csrf_token %}
        {% include "reino/auth/_fields.html" %}
        <button class="btn btn--primary" type="submit">Guardar contraseña</button>
        <a class="btn btn--ghost" href="{% url 'reino_account' %}">Volver a mi cuenta</a>
    </form>
</section>
{% endblock %}
